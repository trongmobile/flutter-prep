name: Đề xuất tính năng
description: Ý tưởng tính năng mới hoặc cải tiến cho website.
labels: ["type: feature"]
body:
  - type: textarea
    id: details
    attributes:
      label: Mô tả tính năng
      description: Bạn muốn website có thêm gì, hoạt động ra sao?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Vì sao cần tính năng này?
      description: Vấn đề bạn đang gặp hoặc lợi ích mang lại.
